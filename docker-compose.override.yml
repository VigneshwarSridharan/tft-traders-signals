# Auto-loaded by `docker compose up` alongside docker-compose.yml whenever
# no explicit -f flags are given (Compose's default file-discovery
# behavior). Publishes Caddy's ports directly on the host — the right
# default for a VM dedicated to this stack (docs/DEPLOY.md's assumption).
#
# Hosts that already run another reverse proxy on 80/443 (e.g. an existing
# nginx-proxy setup) should deploy with explicit files instead, which skips
# this override:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# See docker-compose.prod.yml.
services:
  reverse-proxy:
    ports:
      - "80:80"
      - "443:443"
